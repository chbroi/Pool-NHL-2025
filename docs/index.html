<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pool des Séries NHL</title>

  <style>

    /* ===== THEME ===== */
    :root {
      --bg: #f5f7fb;
      --text: #333;
      --card: white;
      --primary: #007BFF;
    }

    body[data-theme="dark"] {
      --bg: #121212;
      --text: #e0e0e0;
      --card: #1e1e1e;
      --primary: #4dabf7;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    
    @media (max-width: 768px) {
    
      #topBar {
        flex-direction: column;
        align-items: stretch; 
        position: sticky;
          top: 0;
          z-index: 1000;
        backdrop-filter: blur(10px);
      }
    
      
      #tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap; /* important mobile */
      }
      
      #tabs button {
        border: none;
        background: var(--card);
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--text);
        font-weight: 500;
        transition: 0.2s;
      }
      
      #tabs button:hover {
        background: rgba(0,0,0,0.1);
      }
      
      #tabs button.activeTab {
        background: var(--primary);
        color: white;
      }

      
      #mainHeader {
        position: sticky;
        top: 50px; 
        z-index: 999;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      }
    
    }


    /* ===== NAVBAR ===== */
    #topBar {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: var(--card);
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    #tabs {
      display: flex;
      gap: 8px;
    }

    #tabs button {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
    }

    #tabs button:hover {
      background: rgba(0,0,0,0.05);
    }

    #tabs button.activeTab {
      background: var(--primary);
      color: white;
    }

    /* ===== DARK BUTTON ===== */
    #themeToggle {
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      background: var(--card);
      border: 1px solid rgba(0,0,0,0.1);
    }

    #themeToggle:hover {
      background: var(--primary);
      color: white;
    }

    /* ===== HEADER ===== */
    #mainHeader {
      position: sticky;
      top: 50px;
      z-index: 999;
      text-align: center;
      padding: 40px 20px;
      font-size: 26px;
      font-weight: 600;
      background: linear-gradient(135deg, #1e1e1e, #2c3e50);
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    
    
    #rightControls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    
    #rightControls button {
      background: transparent;
      border: 1px solid rgba(0,0,0,0.2);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
    }
    
    #rightControls button:hover {
      background: rgba(0,0,0,0.05);
    }

    
    #userInfo {
      font-size: 14px;
      margin-right: 5px;
      opacity: 0.85;
    }
    
    #helperMessage {
      text-align: center;
      font-size: 18px;
      margin-top: 10px;
      margin-bottom: 20px;
      font-weight: 500;
      opacity: 0.9;
    }

    /* ===== CONTENT ===== */
    
    #homeTab, #submitTab, #resultsTab, #leaderboardTab,
    #rulesTab, #myPicksTab {
      max-width: 1000px;
      margin: 20px auto;
      padding: 10px;
    }

    /* ===== CARDS ===== */
    .section, .card {
      background: var(--card);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.05);
    }

    .matchup {
      background: var(--card);
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }

    /* ===== TABLE ===== */
    .resultsTable {
      width: 100%;
      border-collapse: collapse;
    }

    .resultsTable th {
      background: var(--primary);
      color: white;
      padding: 10px;
    }

    .resultsTable td {
      padding: 8px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    .resultsTable tr:hover {
      background: rgba(0,0,0,0.05);
    }
    
    .roundHeader td {
      text-align: left;
      font-weight: bold;
      padding: 10px;
      background: rgba(255,255,255,0.08);
      font-size: 16px;
    }
    
    .myColumnHeader {
      background: #ffd700;
      color: black;
      position: sticky;
        left: 0;
        z-index: 3;

    }
    .myColumnCell {
      background: rgba(255, 215, 0, 0.12);
      position: sticky;
        left: 0;
        z-index: 3;

    }
    
    .resultsTable th:first-child,
    .resultsTable td:first-child {
      position: sticky;
      left: 0;
      z-index: 4;
      background: #1e1e1e;
    }
    
    .connSmytheRow {
      background: rgba(0, 123, 255, 0.15);
      font-weight: bold;
    }
    
    .totalSubmissionRow {
      background: rgba(0, 123, 255, 0.25);
      text-align: center;
      font-weight: bold;
    }
    
    .totalGlobalRow {
      background: rgba(255, 215, 0, 0.3);
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }


    
    .homeActions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .homeAction {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      border-left: 3px solid transparent;
    }
    
    .homeAction:hover {
      background: rgba(255, 255, 255, 0.06);
      border-left-color: var(--primary);
    }
    
    .homeAction strong {
      min-width: 140px; /* aligne les descriptions */
      color: #ffffff;
    }
    
    .homeAction span {
      color: #bbbbbb;
      font-size: 14px;
    }



    /* ===== BUTTON ===== */
    button {
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

  </style>

</head>

<body data-theme="light">

  <!-- NAVBAR -->

  <div id="topBar">
  
    <div id="tabs">
      <button onclick="showTab('home')">Accueil</button>
      <button onclick="showTab('submit')">Soumettre</button>
      <button onclick="showTab('scoring')">Système de pointage</button>
      <button onclick="showTab('results')">Résultats</button>
      <button onclick="showTab('leaderboard')">Classement</button>
      <button onclick="showTab('rules')">Règlements</button>
    </div>
  
    
    <div id="rightControls">
      <button id="loginBtn">Connexion</button>
      <span id="userInfo"></span>
      <button id="logoutBtn" style="display:none;">Déconnexion</button>
      <button id="themeToggle">🌙</button>
    </div>
    
    <div id="tabDescription" style="
      font-size: 14px;
      opacity: 0.8;
      margin-left: 10px;
    "></div>


  
  </div>


  <!-- HEADER -->
  <div id="mainHeader">
    🏒 Pool des séries éliminatoires de la LNH
  </div>
  <div id="helperMessage"></div>

  <!-- APP -->
  <div id="appContent" style="display:none;">

    <div id="homeTab"></div>
    <div id="submitTab" style="display:none;"></div>
    <div id="scoringTab" style="display:none;"></div>
    <div id="resultsTab" style="display:none;"></div>
    <div id="leaderboardTab" style="display:none;"></div>

    <div id="rulesTab" style="display:none;"></div>

    
<form id="predictionForm" style="display:none;">

  <div class="section" id="round1"></div>
  <div class="section" id="round2"></div>
  <div class="section" id="round3"></div>
  <div class="section" id="round4"></div>

  <div class="section">
    <label for="Conn_Smythe">Gagnant Conn Smythe :</label>
    <select id="Conn_Smythe" name="Conn_Smythe">
      <option value="">Choisir</option>
    </select>
  </div>

<button id="submitBtn" type="button" onclick="submitPredictions()">
  Soumettre
</button>

  <div id="rulesModal" style="display:none;"
     class="modal">

  <div class="card">

    <h2>Participation au Pool NHL</h2>

    <p>
      En soumettant votre première prédiction :
    </p>

    <ul>
      <li>Vous confirmez avoir lu les règlements.</li>
      <li>Vous vous engagez à verser 5 $.</li>
      <li>Vous acceptez le système de pointage.</li>
      <li>Vous acceptez les modalités du pool.</li>
    </ul>

    <label>
      <input
        type="checkbox"
        id="rulesAcceptedCheckbox">

      J'accepte les conditions de participation.
    </label>

    <br><br>

    <button id="acceptModalBtn" disabled>
      Continuer
    </button>

  </div>

</div>
<script type="module" src="js/main.js"></script>

</body>
</html>
